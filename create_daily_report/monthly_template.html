<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Monthly Timeline - {{ month_str }}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-body: #f4f5f7;
      --bg-surface: #ffffff;
      --text-main: #172b4d;
      --text-muted: #5e6c84;
      --border-color: #dfe1e6;
      --link-color: #0969da;
      --badge-bg-success: #e3fcef;
      --badge-text-success: #066637;
      --badge-bg-info: #deebff;
      --badge-text-info: #0052cc;
      --shadow-sm: 0 1px 2px rgba(9, 30, 66, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0d1117;
        --bg-surface: #161b22;
        --text-main: #c9d1d9;
        --text-muted: #8b949e;
        --border-color: #30363d;
        --link-color: #58a6ff;
        --badge-bg-success: rgba(46, 160, 67, 0.15);
        --badge-text-success: #3fb950;
        --badge-bg-info: rgba(56, 139, 253, 0.15);
        --badge-text-info: #58a6ff;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    /* DASHBOARD STYLES */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .stat-title {
      font-size: 0.75em;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-val {
      font-size: 2.2em;
      font-weight: bold;
      color: var(--link-color);
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.7em;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }

    .charts-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }

    .chart-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      position: relative;
      height: 300px;
    }

    /* GANTT CHART STYLES */
    .gantt-wrapper {
      overflow-x: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .gantt-ticket-header {
      font-weight: bold;
      padding: 8px;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.85em;
      position: sticky;
      left: 0;
      background: var(--bg-surface);
      z-index: 2;
    }

    .gantt-day-header {
      font-weight: bold;
      text-align: center;
      padding: 8px 0;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85em;
    }

    .gantt-ticket-cell {
      padding: 8px;
      border-bottom: 1px dashed var(--border-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      position: sticky;
      left: 0;
      background: var(--bg-surface);
      z-index: 1;
    }

    .gantt-track {
      display: grid;
      gap: 2px;
      border-bottom: 1px dashed var(--border-color);
      padding: 6px 0;
    }

    .gantt-bar {
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75em;
      color: var(--text-main);
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: filter 0.2s;
    }

    .gantt-bar:hover {
      filter: brightness(0.9);
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="/" style="font-weight: bold;">⬅️ Back to Daily Reports</a>
    <h1 style="margin: 0;">Monthly Review: {{ month_str }}</h1>
    <div></div>
  </div>

  <div class="dashboard-grid">
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-title">Merge Frequency</div>
        <div class="stat-val" id="val-merge-freq">--</div>
        <span class="stat-sub">PRs / Dev / Week</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">Avg PR Size</div>
        <div class="stat-val" id="val-pr-size">--</div>
        <span class="stat-sub">Lines Changed</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">Cycle Time</div>
        <div class="stat-val" id="val-cycle-time">--</div>
        <span class="stat-sub">Days</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">PR Pickup Time</div>
        <div class="stat-val" id="val-pickup-time">--</div>
        <span class="stat-sub">Hours</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">PR Review Time</div>
        <div class="stat-val" id="val-review-time">--</div>
        <span class="stat-sub">Hours</span>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-container">
        <canvas id="prChart"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="cycleChart"></canvas>
      </div>
    </div>
  </div>

  <h2 style="border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px;">Workload Gantt Chart
  </h2>
  <div id="timeline" class="gantt-wrapper">
    <div style="color: var(--text-muted);">Loading timeline data...</div>
  </div>

  <script>
    async function loadTimeline() {
      try {
        const res = await fetch('/api/month/{{ month_str }}');
        const data = await res.json();

        // 1. Populate Stat Cards
        document.getElementById('val-merge-freq').innerText = data.rollup.merge_frequency;
        document.getElementById('val-pr-size').innerText = data.rollup.pr_size;
        document.getElementById('val-cycle-time').innerText = data.rollup.cycle_time;
        document.getElementById('val-pickup-time').innerText = data.rollup.pickup_time;
        document.getElementById('val-review-time').innerText = data.rollup.review_time;

        // 2. Render Charts
        Chart.defaults.color = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
        const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();

        new Chart(document.getElementById('prChart'), {
          type: 'line',
          data: {
            labels: data.trends.dates,
            datasets: [
              {label: 'PRs Merged', data: data.trends.prs_merged, borderColor: '#8250df', backgroundColor: 'rgba(130, 80, 223, 0.1)', fill: true, tension: 0.3},
              {label: 'PRs Opened', data: data.trends.prs_opened, borderColor: '#2da44e', backgroundColor: 'transparent', borderDash: [5, 5], tension: 0.3}
            ]
          },
          options: {responsive: true, maintainAspectRatio: false, plugins: {title: {display: true, text: 'Pull Request Volume Trend'}}, scales: {x: {grid: {color: gridColor}}, y: {grid: {color: gridColor}, beginAtZero: true, ticks: {stepSize: 1}}}}
        });

        new Chart(document.getElementById('cycleChart'), {
          type: 'line',
          data: {
            labels: data.trends.dates,
            datasets: [
              {label: 'Avg PR Cycle (Days)', data: data.trends.pr_cycle_time, borderColor: '#0969da', backgroundColor: 'rgba(9, 105, 218, 0.1)', fill: true, tension: 0.3, spanGaps: true}
            ]
          },
          options: {responsive: true, maintainAspectRatio: false, plugins: {title: {display: true, text: 'PR Cycle Time Trend (Days)'}}, scales: {x: {grid: {color: gridColor}}, y: {grid: {color: gridColor}, beginAtZero: true}}}
        });

        // 3. Render Gantt Chart
        const container = document.getElementById('timeline');
        if (data.days.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted);">No reports found for this month.</div>';
          return;
        }

        // Compile exact lifespan of each ticket based on the daily snapshots
        const tickets = {};
        const dateList = data.days.map(d => d.date);
        const dayLabels = dateList.map(d => d.slice(-2));

        data.days.forEach((day, dayIndex) => {
          const processTicket = (t, status) => {
            if (!tickets[t.key]) {
              tickets[t.key] = {
                key: t.key,
                summary: t.summary,
                type: t.type,
                startIndex: dayIndex,
                endIndex: dayIndex,
                status: status
              };
            } else {
              tickets[t.key].endIndex = dayIndex;
              // Once a ticket is marked done, lock its status to done
              if (status === 'done') tickets[t.key].status = 'done';
            }
          };
          day.active.forEach(t => processTicket(t, 'active'));
          day.done.forEach(t => processTicket(t, 'done'));
        });

        // Sort: Epics first, then Tasks, then alphabetically by Key
        const ticketArray = Object.values(tickets).sort((a, b) => {
          if (a.type !== b.type) return a.type === 'Epic' ? -1 : 1;
          return a.key.localeCompare(b.key);
        });

        const cols = dateList.length;

        let html = `
                    <div style="display: grid; grid-template-columns: 350px repeat(${cols}, minmax(35px, 1fr)); gap: 0 4px; align-items: center; min-width: max-content;">
                        <div class="gantt-ticket-header">Ticket & Summary</div>
                        ${dayLabels.map(d => `<div class="gantt-day-header">${d}</div>`).join('')}
                `;

        ticketArray.forEach(t => {
          const duration = t.endIndex - t.startIndex + 1;
          const startGridCol = t.startIndex + 1;

          const bgColor = t.status === 'done' ? 'var(--badge-bg-success)' : 'var(--badge-bg-info)';
          const borderColor = t.status === 'done' ? 'var(--badge-text-success)' : 'var(--badge-text-info)';
          const statusText = t.status === 'done' ? 'Done' : 'Active';
          const icon = t.type === 'Epic' ? '🟣' : '📘';

          html += `
                        <div class="gantt-ticket-cell" title="[${t.key}] ${t.summary}">
                            <a href="/${dateList[t.endIndex]}" target="_blank" style="font-weight: bold; font-family: monospace; color: var(--link-color);">[${t.key}]</a> 
                            <span style="font-size: 0.9em; opacity: 0.8; margin-left: 4px;">${icon} ${t.summary}</span>
                        </div>
                        
                        <div class="gantt-track" style="grid-column: 2 / span ${cols}; grid-template-columns: repeat(${cols}, 1fr);">
                            <div class="gantt-bar" style="grid-column: ${startGridCol} / span ${duration}; background: ${bgColor}; border-left: 4px solid ${borderColor};" 
                                 title="Started: ${dateList[t.startIndex]}\nEnded/Last Seen: ${dateList[t.endIndex]}\nStatus: ${statusText}"
                                 onclick="window.open('/${dateList[t.endIndex]}', '_blank')">
                                ${statusText} (${duration}d)
                            </div>
                        </div>
                    `;
        });

        html += `</div>`;
        container.innerHTML = html;

      } catch (err) {
        document.getElementById('timeline').innerHTML = '<div style="color: red;">Failed to load timeline data.</div>';
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadTimeline);
  </script>
</body>

</html>
