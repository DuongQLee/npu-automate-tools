<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Monthly Timeline - {{ month_str }}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-body: #f4f5f7;
      --bg-surface: #ffffff;
      --bg-surface-hover: #fafbfc;
      --bg-surface-muted: #f6f8fa;
      --text-main: #172b4d;
      --text-muted: #5e6c84;
      --border-color: #dfe1e6;
      --link-color: #0969da;
      --badge-bg-success: #e3fcef;
      --badge-text-success: #066637;
      --badge-bg-info: #deebff;
      --badge-text-info: #0052cc;
      --badge-bg-warn: #fffae6;
      --badge-text-warn: #ff8b00;
      --badge-bg-danger: #ffebe6;
      --badge-text-danger: #bf2600;
      --pr-open: #2da44e;
      --pr-merged: #8250df;
      --pr-closed: #cf222e;
      --shadow-sm: 0 1px 2px rgba(9, 30, 66, 0.05);
      --shadow-lg: 0 8px 16px rgba(9, 30, 66, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0d1117;
        --bg-surface: #161b22;
        --bg-surface-hover: #21262d;
        --bg-surface-muted: #010409;
        --text-main: #c9d1d9;
        --text-muted: #8b949e;
        --border-color: #30363d;
        --link-color: #58a6ff;
        --badge-bg-success: rgba(46, 160, 67, 0.15);
        --badge-text-success: #3fb950;
        --badge-bg-info: rgba(56, 139, 253, 0.15);
        --badge-text-info: #58a6ff;
        --badge-bg-warn: rgba(210, 153, 34, 0.15);
        --badge-text-warn: #d29922;
        --badge-bg-danger: rgba(248, 81, 73, 0.15);
        --badge-text-danger: #ff7b72;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.8);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    /* HEADER & CALENDAR STYLES */
    .header-container {
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    .header-title {
      position: relative;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    #dateDropdown {
      display: none;
      position: absolute;
      top: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      z-index: 3000;
      border-radius: 8px;
      padding: 16px;
      min-width: 280px;
      text-align: left;
      font-size: 0.95em;
      cursor: default;
    }

    /* DASHBOARD STYLES */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .stat-title {
      font-size: 0.75em;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-val {
      font-size: 2.2em;
      font-weight: bold;
      color: var(--link-color);
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.7em;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }

    .charts-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }

    .chart-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      position: relative;
      height: 300px;
    }

    /* GANTT CONTROLS */
    .controls-bar {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 12px;
      padding: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
    }

    .filter-group {
      display: flex;
      gap: 16px;
      font-size: 0.9em;
      font-weight: bold;
      color: var(--text-main);
    }

    .filter-group label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sort-group select {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      outline: none;
      cursor: pointer;
      font-weight: bold;
    }

    /* GANTT CHART ENGINE */
    .gantt-wrapper {
      overflow: auto;
      max-height: 800px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .gantt-ticket-header {
      height: 46px;
      box-sizing: border-box;
      font-weight: bold;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.85em;
      position: sticky;
      left: 0;
      top: 0;
      background: var(--bg-surface);
      z-index: 20;
    }

    .gantt-day-header {
      height: 46px;
      box-sizing: border-box;
      font-weight: bold;
      text-align: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85em;
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      z-index: 10;
      transition: all 0.2s;
    }

    .gantt-day-header.clickable {
      cursor: pointer;
      color: var(--link-color);
    }

    .gantt-day-header.clickable:hover {
      background: var(--bg-surface-hover);
    }

    .gantt-day-header.active-date {
      background: var(--badge-bg-info);
      color: var(--badge-text-info);
      border-bottom: 2px solid var(--link-color);
    }

    .gantt-day-header.disabled-date {
      opacity: 0.3;
      pointer-events: none;
      background: transparent !important;
    }

    .gantt-ticket-cell {
      height: 40px;
      box-sizing: border-box;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      position: sticky;
      left: 0;
      background: var(--bg-surface);
      z-index: 5;
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      align-items: center;
    }

    .gantt-ticket-cell:hover {
      background: var(--bg-surface-hover);
    }

    .gantt-ticket-cell.expanded {
      background: var(--badge-bg-info);
      border-left: 4px solid var(--badge-text-info);
      padding-left: 12px;
    }

    .gantt-track {
      height: 40px;
      box-sizing: border-box;
      display: grid;
      border-bottom: 1px solid var(--border-color);
      align-items: center;
    }

    .gantt-bar {
      position: relative;
      border-radius: 4px;
      display: flex;
      box-shadow: var(--shadow-sm);
      transition: filter 0.2s;
      cursor: pointer;
      height: 28px;
      margin: 6px 0;
    }

    .gantt-bar:hover {
      filter: brightness(0.9);
    }

    .gantt-bar-label {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      padding: 4px 8px;
      font-size: 0.75em;
      color: var(--text-main);
      font-weight: bold;
      pointer-events: none;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .day-segment {
      flex: 1;
      height: 100%;
      transition: background 0.1s;
      box-sizing: border-box;
    }

    /* DETAIL PANEL ACCORDION (Mirrored EXACTLY from Daily Report) */
    summary {
      list-style: none;
      outline: none;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::before,
    .collapse-icon,
    .pr-row-icon {
      display: none !important;
    }

    .task-block {
      border-radius: 6px;
      background: var(--bg-surface);
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      width: 100%;
      box-sizing: border-box;
    }

    .task-summary {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.95em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 46px;
      z-index: 15;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .task-content {
      padding: 0;
      background: var(--bg-surface);
      max-height: 60vh;
      overflow-y: auto;
    }

    .sub-collapse {
      border-top: 1px solid var(--border-color);
    }

    .sub-collapse:first-child {
      border-top: none;
    }

    .sub-collapse summary:hover {
      background: var(--bg-surface-hover);
    }

    .sub-content {
      padding: 16px;
      font-size: 0.95em;
      background: var(--bg-body);
    }

    .ticket-title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-grow: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .jira-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .ticket-id {
      font-family: monospace;
      opacity: 0.8;
      margin-right: 2px;
      flex-shrink: 0;
    }

    .ticket-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pr-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-size: 0.95em;
    }

    .pr-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.85em;
      font-weight: normal;
      flex-shrink: 0;
    }

    .diff-add {
      color: #2da44e;
      font-weight: 600;
    }

    .diff-del {
      color: #cf222e;
      font-weight: 600;
    }

    .meta-tags {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.8em;
      color: var(--text-muted);
      font-weight: normal;
      margin-left: 8px;
    }

    .comment-card {
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }

    .comment-header {
      margin-bottom: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-time {
      color: var(--text-muted);
      font-size: 0.85em;
      font-weight: normal;
      margin-left: auto;
    }

    .avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background: var(--bg-surface-muted);
      flex-shrink: 0;
    }

    .tag-pill {
      color: var(--link-color);
      font-size: 0.8em;
      margin-left: 6px;
      background: var(--badge-bg-info);
      padding: 2px 8px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <svg style="display:none;">
    <symbol id="icon-epic" viewBox="0 0 16 16" fill="none">
      <path d="M8.5 1L2 9h5l-1 6 7-8H8l1.5-6z" fill="#904EE2" stroke="#904EE2" stroke-width="1" stroke-linejoin="round">
      </path>
    </symbol>
    <symbol id="icon-task" viewBox="0 0 16 16" fill="none">
      <rect x="1" y="1" width="14" height="14" rx="3" fill="#4C9AFF"></rect>
      <path d="M4.5 8L7 10.5L11.5 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      </path>
    </symbol>
    <symbol id="icon-git-pr" viewBox="0 0 16 16" fill="currentColor">
      <path
        d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm13.25 5.5a2.25 2.25 0 1 1-3-2.122V5.25A2.25 2.25 0 0 0 9.5 3h-1.25a.75.75 0 0 1 0-1.5h1.25A3.75 3.75 0 0 1 13.25 5.25v1.378a2.251 2.251 0 0 1 1.5 2.122ZM1.5 12a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0ZM12-8.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0ZM3 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm10.5 8.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z">
      </path>
    </symbol>
    <symbol id="icon-git-merge" viewBox="0 0 16 16" fill="currentColor">
      <path
        d="M5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 5 3.25Zm2.25 3.128a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854v2.396h4.146a.25.25 0 0 1 .25.25v2.25a.25.25 0 0 1-.25.25H10v2.396a.25.25 0 0 1-.427.177L7.177 6.177a.25.25 0 0 1 0-.354Z">
      </path>
    </symbol>
  </svg>

  <div class="header-container">
    <div class="header-title" onclick="toggleCalendar(event)">
      <h1 id="monthlyHeaderTitle" style="margin:0; font-size: 1.8em; padding-top: 5px;"
        title="Click to jump to another date">Monthly Report 📅</h1>
      <div id="dateDropdown"></div>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-title">Merge Frequency</div>
        <div class="stat-val" id="val-merge-freq">--</div>
        <span class="stat-sub">PRs / Dev / Week</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">Avg PR Size</div>
        <div class="stat-val" id="val-pr-size">--</div>
        <span class="stat-sub">Lines Changed</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">Cycle Time</div>
        <div class="stat-val" id="val-cycle-time">--</div>
        <span class="stat-sub">Days</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">PR Pickup Time</div>
        <div class="stat-val" id="val-pickup-time">--</div>
        <span class="stat-sub">Hours</span>
      </div>
      <div class="stat-card">
        <div class="stat-title">PR Review Time</div>
        <div class="stat-val" id="val-review-time">--</div>
        <span class="stat-sub">Hours</span>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-container">
        <canvas id="prChart"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="cycleChart"></canvas>
      </div>
    </div>
  </div>

  <h2 style="border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px;">Workload Gantt Chart
  </h2>

  <div class="controls-bar">
    <div class="filter-group">
      <label><input type="checkbox" id="f-done" checked onchange="renderGantt()"> ✅ Done/Closed</label>
      <label><input type="checkbox" id="f-ip" checked onchange="renderGantt()"> ⏳ In Progress</label>
      <label><input type="checkbox" id="f-todo" checked onchange="renderGantt()"> �� To Do / On Hold</label>
    </div>
    <div class="sort-group" style="margin-left: auto;">
      <select id="s-sort" onchange="renderGantt()">
        <option value="status-asc">Sort: Status (Active &rarr; Done)</option>
        <option value="status-desc">Sort: Status (Done &rarr; Active)</option>
        <option value="type">Sort: Type (Epic &rarr; Task)</option>
      </select>
    </div>
  </div>

  <div id="timeline" class="gantt-wrapper">
    <div style="color: var(--text-muted);">Loading timeline data...</div>
  </div>

  <script>
    window.monthData = null;
    window.ticketMap = {};
    window.continuousDates = [];
    window.expandedTicket = null;
    window.selectedDate = null;

    // Calendar Integration Logic
    let calendarDates = new Set();
    let calViewDate = new Date("{{ month_str }}-01T00:00:00");

    async function toggleCalendar(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('dateDropdown');
      if (dropdown.style.display === 'block') {
        dropdown.style.display = 'none';
        return;
      }
      dropdown.style.display = 'block';
      if (calendarDates.size === 0) {
        dropdown.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-muted);">Loading calendar...</div>';
        try {
          const res = await fetch('/api/available_dates');
          const dates = await res.json();
          calendarDates = new Set(dates);
        } catch (err) {
          dropdown.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--badge-text-danger);">Failed to load API</div>';
          return;
        }
      }
      renderCalendar();
    }

    function changeMonth(offset) {
      calViewDate.setMonth(calViewDate.getMonth() + offset);
      renderCalendar();
    }

    function renderCalendar() {
      const dropdown = document.getElementById('dateDropdown');
      const year = calViewDate.getFullYear();
      const month = calViewDate.getMonth();
      const monthName = calViewDate.toLocaleString('default', {month: 'long'});
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold;">
          <button onclick="changeMonth(-1)" style="background:var(--bg-surface-muted); border:1px solid var(--border-color); border-radius:4px; cursor:pointer; color:var(--text-main); width:28px; height:28px; display:flex; align-items:center; justify-content:center;">&lt;</button>
          <span style="font-size:1.1em">${monthName} ${year}</span>
          <button onclick="changeMonth(1)" style="background:var(--bg-surface-muted); border:1px solid var(--border-color); border-radius:4px; cursor:pointer; color:var(--text-main); width:28px; height:28px; display:flex; align-items:center; justify-content:center;">&gt;</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.85em; margin-bottom: 6px; color: var(--text-muted); font-weight: bold;">
          <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.95em;">
      `;

      for (let i = 0; i < firstDay; i++) {html += `<div></div>`;}

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isAvailable = calendarDates.has(dateStr);
        let cellStyle = "padding: 6px 0; border-radius: 4px; transition: background 0.2s;";
        let onClick = "";

        if (isAvailable) {
          cellStyle += " background: var(--badge-bg-success); color: var(--badge-text-success); font-weight: bold; cursor: pointer;";
          onClick = `onclick="window.location.href='/${dateStr}'" onmouseover="this.style.filter='brightness(0.95)'" onmouseout="this.style.filter='none'"`;
        } else {
          cellStyle += " color: var(--text-muted); opacity: 0.35; cursor: not-allowed; background: transparent;";
        }
        html += `<div style="${cellStyle}" ${onClick}>${day}</div>`;
      }
      html += `</div>`;

      const targetMonthStr = `${year}-${String(month + 1).padStart(2, '0')}`;
      html += `
        <div style="margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 12px;">
            <button onclick="window.location.href='/month/${targetMonthStr}'" style="width: 100%; padding: 8px; background: var(--bg-surface-muted); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-weight: bold; color: var(--text-main); transition: filter 0.2s;" onmouseover="this.style.filter='brightness(0.95)'" onmouseout="this.style.filter='none'">
                🗓️ View Monthly Timeline
            </button>
        </div>
      `;
      dropdown.innerHTML = html;
    }

    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('dateDropdown');
      if (dropdown && dropdown.style.display === 'block' && !e.target.closest('.header-title')) {
        dropdown.style.display = 'none';
      }
    });

    // Handle Keyboard Navigation (Left/Right Arrows) for Timeline jumping
    document.addEventListener('keydown', (e) => {
      if (!window.expandedTicket || !window.selectedDate) return;

      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        const ticketData = window.ticketMap[window.expandedTicket];
        const availableDates = Object.keys(ticketData.days).sort();
        if (availableDates.length === 0) return;

        const currentIndex = availableDates.indexOf(window.selectedDate);
        let newIndex = currentIndex;

        if (e.key === "ArrowLeft" && currentIndex > 0) {
          newIndex = currentIndex - 1;
        } else if (e.key === "ArrowRight" && currentIndex < availableDates.length - 1) {
          newIndex = currentIndex + 1;
        }

        if (newIndex !== currentIndex) {
          selectDay(window.expandedTicket, availableDates[newIndex], {stopPropagation: () => { }});
        }
      }
    });

    async function initDashboard() {
      // Setup dynamic header title based on month parameter
      const [yy, mm] = "{{ month_str }}".split('-');
      const mDateObj = new Date(yy, mm - 1);
      const displayMonth = mDateObj.toLocaleString('default', {month: 'short'});
      document.getElementById('monthlyHeaderTitle').innerText = `Monthly Report ${displayMonth} ${yy} 📅`;

      try {
        const res = await fetch('/api/month/{{ month_str }}');
        window.monthData = await res.json();

        document.getElementById('val-merge-freq').innerText = window.monthData.rollup.merge_frequency;
        document.getElementById('val-pr-size').innerText = window.monthData.rollup.pr_size;
        document.getElementById('val-cycle-time').innerText = window.monthData.rollup.cycle_time;
        document.getElementById('val-pickup-time').innerText = window.monthData.rollup.pickup_time;
        document.getElementById('val-review-time').innerText = window.monthData.rollup.review_time;

        Chart.defaults.color = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
        const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();

        new Chart(document.getElementById('prChart'), {
          type: 'line',
          data: {
            labels: window.monthData.trends.dates,
            datasets: [
              {label: 'PRs Merged', data: window.monthData.trends.prs_merged, borderColor: '#8250df', backgroundColor: 'rgba(130, 80, 223, 0.1)', fill: true, tension: 0.3},
              {label: 'PRs Opened', data: window.monthData.trends.prs_opened, borderColor: '#2da44e', backgroundColor: 'transparent', borderDash: [5, 5], tension: 0.3}
            ]
          },
          options: {responsive: true, maintainAspectRatio: false, plugins: {title: {display: true, text: 'Pull Request Volume Trend'}}, scales: {x: {grid: {color: gridColor}}, y: {grid: {color: gridColor}, beginAtZero: true, ticks: {stepSize: 1}}}}
        });

        new Chart(document.getElementById('cycleChart'), {
          type: 'line',
          data: {
            labels: window.monthData.trends.dates,
            datasets: [
              {label: 'Avg PR Cycle (Days)', data: window.monthData.trends.pr_cycle_time, borderColor: '#0969da', backgroundColor: 'rgba(9, 105, 218, 0.1)', fill: true, tension: 0.3, spanGaps: true}
            ]
          },
          options: {responsive: true, maintainAspectRatio: false, plugins: {title: {display: true, text: 'PR Cycle Time Trend (Days)'}}, scales: {x: {grid: {color: gridColor}}, y: {grid: {color: gridColor}, beginAtZero: true}}}
        });

        processTicketData();
        renderGantt();

      } catch (err) {
        document.getElementById('timeline').innerHTML = '<div style="color: red;">Failed to load timeline data.</div>';
        console.error(err);
      }
    }

    function processTicketData() {
      window.continuousDates = window.monthData.continuous_dates || [];

      window.monthData.days.forEach((day) => {
        const globalIndex = window.continuousDates.indexOf(day.date);
        if (globalIndex === -1) return; // Skip if date is wildly out of bounds

        const process = (t) => {
          if (!window.ticketMap[t.key]) {
            window.ticketMap[t.key] = {
              key: t.key, summary: t.summary, type: t.type,
              startIndex: globalIndex, endIndex: globalIndex,
              days: {}, overallStatus: t.status_key
            };
          }
          if (globalIndex > window.ticketMap[t.key].endIndex) window.ticketMap[t.key].endIndex = globalIndex;
          if (globalIndex < window.ticketMap[t.key].startIndex) window.ticketMap[t.key].startIndex = globalIndex;

          window.ticketMap[t.key].days[day.date] = t;
          window.ticketMap[t.key].overallStatus = t.status_key;
        };

        day.active.forEach(t => process(t));
        day.done.forEach(t => process(t));
      });
    }

    function toggleTicket(key) {
      if (window.expandedTicket === key) {
        window.expandedTicket = null;
      } else {
        window.expandedTicket = key;
        const availableDates = Object.keys(window.ticketMap[key].days).sort();
        window.selectedDate = availableDates.length > 0 ? availableDates[0] : window.continuousDates[window.ticketMap[key].startIndex];
      }
      renderGantt();
    }

    function selectDay(key, dateStr, e) {
      e.stopPropagation();
      window.expandedTicket = key;
      window.selectedDate = dateStr;
      renderGantt();
    }

    function renderDetailPanel(ticket) {
      const dayData = ticket.days[window.selectedDate];

      if (!dayData) {
        return `<div class="task-block"><div class="task-content" style="padding: 20px; text-align: center; color: var(--text-muted);">No activity recorded for this ticket on ${window.selectedDate}.</div></div>`;
      }

      const t_bg = dayData.status_key === 'success' ? 'success' : (dayData.status_key === 'info' || dayData.status_key === 'purple' ? 'info' : (dayData.status_key === 'danger' ? 'danger' : 'todo'));

      // --- 1. Pull Requests HTML ---
      let prHtml = "";
      if (dayData.prs && dayData.prs.length > 0) {
        prHtml = `<details class="sub-collapse pr-section" open>
            <summary style="padding:10px 16px; font-weight:600; pointer-events: auto; background: var(--bg-surface-muted);">Pull Requests (${dayData.prs.length})</summary>
            <div class="sub-content" style="padding-top: 8px;">`;

        dayData.prs.forEach(pr => {
          let reviewerHtml = pr.reviewer_badges && pr.reviewer_badges.length > 0 ?
            `<div style="font-size: 0.85em; color: var(--text-muted); padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--border-color);">�� Reviewers: ${pr.reviewer_badges.join(', ')}</div>` : '';

          prHtml += `
            <details class="pr-collapse searchable-item ${pr.is_draft ? 'draft-pr' : ''}" style="margin-bottom: 8px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-surface);">
                <summary class="pr-summary" style="pointer-events: auto;">
                    <div class="ticket-title-wrapper">
                        <svg class="jira-icon" style="color: ${pr.text_color};"><use href="#${pr.icon}"></use></svg>
                        <a href="${pr.url}" class="ticket-id" target="_blank">[${ticket.key}]</a>
                        <span class="ticket-title-text" style="font-weight: 600;">${pr.clean_title}</span>
                    </div>
                    <div class="pr-meta">
                        <span style="color: #2da44e; font-weight: 600;">+${pr.additions}</span>
                        <span style="color: #cf222e; font-weight: 600;">-${pr.deletions}</span>
                        <span style="font-weight: bold; color: ${pr.text_color};">${pr.state_str}</span>
                    </div>
                </summary>
                <div style="padding:10px 16px; border-top:1px dashed var(--border-color); background: var(--bg-surface-hover);">
                    <div>${pr.body}</div>
                    ${reviewerHtml}
                </div>
            </details>`;
        });
        prHtml += `</div></details>`;
      }

      // --- 2. Comments HTML ---
      let commentHtml = "";
      if (dayData.target_comments && dayData.target_comments.length > 0) {
        commentHtml = `<details class="sub-collapse comments-section" open>
            <summary style="padding:10px 16px; font-weight:600; pointer-events: auto; background: var(--bg-surface-muted);">Comments (${dayData.target_comments.length})</summary>
            <div class="sub-content" style="padding: 16px;">`;

        dayData.target_comments.forEach(c => {
          let tagsHtml = (c.tags || []).map(t => `<span class='tag-pill'>${t}</span>`).join('');
          let summaryHtml = c.summary ? `
                <details class='comment-collapse' style="margin-top: 8px;">
                    <summary style='font-weight:600; padding:10px; background:var(--bg-surface-muted); border-radius:4px; pointer-events: auto;'>${c.summary} ${tagsHtml}</summary>
                    <div style='padding-top:10px'>${c.body}</div>
                </details>` : `<div style="margin-top: 8px;">${c.body}</div>`;

          commentHtml += `
                <div class="comment-card">
                    <div class="comment-header">
                        ${c.avatar_url ? `<img src="${c.avatar_url}" class="avatar">` : '👤'}
                        <span>${c.author}</span>
                        <span class="comment-time">${c.time_str}</span>
                    </div>
                    ${summaryHtml}
                </div>`;
        });
        commentHtml += `</div></details>`;
      }

      // --- 3. Wrapper Assembly ---
      const iconId = ticket.type === 'Epic' ? 'icon-epic' : 'icon-task';

      return `
        <div class="task-block" id="panel-${ticket.key}" style="border: 2px solid var(--badge-text-${t_bg}); margin: 0; background: var(--bg-surface); box-shadow: var(--shadow-lg);">
            <details open>
                <summary class="task-summary" style="background: var(--bg-surface); border-bottom: 1px solid var(--border-color); pointer-events: none;">
                    <div class="ticket-title-wrapper">
                        <svg class="jira-icon"><use href="#${iconId}"></use></svg>
                        <a href="https://{{ domain }}/browse/${ticket.key}" class="ticket-id" target="_blank" style="pointer-events: auto;">[${ticket.key}]</a> 
                        <span class="ticket-title-text">${ticket.summary}</span>
                    </div>
                    <div class="meta-tags">
                        <span style="font-weight: bold; color: var(--text-main); font-size: 1.1em; background: var(--badge-bg-${t_bg}); color: var(--badge-text-${t_bg}); padding: 2px 8px; border-radius: 4px;">Snapshot: ${window.selectedDate}</span>
                        <span style="font-size: 0.85em; opacity: 0.7; margin-left: 8px;">(Use ⟵ &nbsp; ⟶ keys)</span>
                        <button onclick="toggleTicket('${ticket.key}')" style="cursor: pointer; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 12px; margin-left: 12px; pointer-events: auto; font-weight: bold; color: var(--text-muted);">Close</button>
                    </div>
                </summary>
                <div class="task-content" style="max-height: 50vh; overflow-y: auto;">
                    <details class="sub-collapse issue-desc" open>
                        <summary style="padding:10px 16px; font-weight:600; pointer-events: auto; background: var(--bg-surface-muted);">Issue Description</summary>
                        <div class="sub-content" style="background: var(--bg-surface);">
                            ${dayData.desc_html || '<em style="color: var(--text-muted);">No description</em>'}
                        </div>
                    </details>
                    ${prHtml}
                    ${commentHtml}
                    ${(!prHtml && !commentHtml) ? '<div style="padding: 20px; text-align: center; color: var(--text-muted); border-top: 1px dashed var(--border-color);">No PRs or Comments recorded on this specific date.</div>' : ''}
                </div>
            </details>
        </div>
      `;
    }

    function renderGantt() {
      const container = document.getElementById('timeline');
      const fDone = document.getElementById('f-done').checked;
      const fIp = document.getElementById('f-ip').checked;
      const fTodo = document.getElementById('f-todo').checked;
      const sortVal = document.getElementById('s-sort').value;

      // Filter Logic
      let filtered = Object.values(window.ticketMap).filter(t => {
        const s = t.overallStatus;
        const isDone = (s === 'success');
        const isIp = (s === 'info' || s === 'purple');
        const isTodo = (s === 'todo' || s === 'warn' || s === 'danger');

        if (isDone && !fDone) return false;
        if (isIp && !fIp) return false;
        if (isTodo && !fTodo) return false;
        return true;
      });

      // Sort Logic
      filtered.sort((a, b) => {
        if (sortVal === 'type') {
          if (a.type !== b.type) return a.type === 'Epic' ? -1 : 1;
          return a.key.localeCompare(b.key);
        } else if (sortVal === 'status-asc') {
          const wa = a.overallStatus === 'success' ? 1 : (a.overallStatus === 'info' || a.overallStatus === 'purple' ? 0 : -1);
          const wb = b.overallStatus === 'success' ? 1 : (b.overallStatus === 'info' || b.overallStatus === 'purple' ? 0 : -1);
          if (wa !== wb) return wa - wb;
          return a.key.localeCompare(b.key);
        } else if (sortVal === 'status-desc') {
          const wa = a.overallStatus === 'success' ? -1 : (a.overallStatus === 'info' || a.overallStatus === 'purple' ? 0 : 1);
          const wb = b.overallStatus === 'success' ? -1 : (b.overallStatus === 'info' || b.overallStatus === 'purple' ? 0 : 1);
          if (wa !== wb) return wa - wb;
          return a.key.localeCompare(b.key);
        }
      });

      const cols = window.continuousDates.length;

      // FIXED: gap: 0 0 prevents any implicit fractional stretching in CSS grid.
      let html = `<div style="display: grid; grid-template-columns: 350px repeat(${cols}, 45px); gap: 0 0; min-width: max-content; padding-bottom: 24px;">`;
      html += `<div class="gantt-ticket-header">Ticket & Summary</div>`;

      // Render Continuous Date Headers
      window.continuousDates.forEach(dateStr => {
        const dayLabel = dateStr.slice(-2);
        let isClickable = false;
        let isActiveDate = false;

        if (window.expandedTicket) {
          const ticketData = window.ticketMap[window.expandedTicket];
          const hasData = !!ticketData.days[dateStr];
          if (hasData) {
            isClickable = true;
            isActiveDate = (window.selectedDate === dateStr);
          }
        }

        let headerClass = "gantt-day-header";
        if (isClickable) headerClass += " clickable";
        if (isActiveDate) headerClass += " active-date";
        if (window.expandedTicket && !isClickable) headerClass += " disabled-date";

        let clickAttr = isClickable ? `onclick="selectDay('${window.expandedTicket}', '${dateStr}', event)" title="View ${dateStr}"` : "";

        html += `<div class="${headerClass}" ${clickAttr}>${dayLabel}</div>`;
      });

      filtered.forEach(t => {
        const duration = t.endIndex - t.startIndex + 1;
        const startCol = t.startIndex + 1;
        const isDone = t.overallStatus === 'success';

        const bgColor = isDone ? 'var(--badge-bg-success)' : 'var(--badge-bg-info)';
        const borderColor = isDone ? 'var(--badge-text-success)' : 'var(--badge-text-info)';
        const statusText = isDone ? 'Done' : 'Active';
        const iconId = t.type === 'Epic' ? 'icon-epic' : 'icon-task';
        const expandedClass = window.expandedTicket === t.key ? 'expanded' : '';

        const iconHtml = `<svg class="jira-icon" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;"><use href="#${iconId}"></use></svg>`;

        // Fixed height ticket label cell
        html += `
            <div class="gantt-ticket-cell ${expandedClass}" title="[${t.key}] ${t.summary}" onclick="toggleTicket('${t.key}')">
                <span style="font-weight: bold; font-family: monospace; color: var(--link-color);">[${t.key}]</span> 
                <span style="font-size: 0.9em; opacity: 0.8; margin-left: 4px;">${iconHtml} ${t.summary}</span>
            </div>
        `;

        // Interactive Track Segments (Invisible hitboxes to keep the bar looking solid)
        let segmentsHtml = "";
        for (let i = 0; i < duration; i++) {
          const currentDayStr = window.continuousDates[t.startIndex + i];
          const isSelected = window.expandedTicket === t.key && window.selectedDate === currentDayStr;

          let segBg = "transparent";
          let borderStyle = "";

          if (isSelected) {
            segBg = "rgba(0,0,0,0.15)";
            borderStyle = "border: 2px solid var(--text-main); border-radius: 4px; box-sizing: border-box; z-index: 6;";
          }

          segmentsHtml += `<div class="day-segment" style="background: ${segBg}; ${borderStyle} position: relative; z-index: 5;" 
                onmouseover="this.style.background='rgba(0,0,0,0.1)'" 
                onmouseout="this.style.background='${segBg}'" 
                onclick="selectDay('${t.key}', '${currentDayStr}', event)" title="${currentDayStr}"></div>`;
        }

        // Fixed height track container spanning 1fr (exactly matches parent 45px because of gap:0)
        html += `
            <div class="gantt-track" style="grid-column: 2 / span ${cols}; grid-template-columns: repeat(${cols}, 1fr);">
                <div class="gantt-bar" style="grid-column: ${startCol} / span ${duration}; background: ${bgColor}; border-left: 4px solid ${borderColor};" onclick="toggleTicket('${t.key}')">
                    <div class="gantt-bar-label">${statusText}</div>
                    ${segmentsHtml}
                </div>
            </div>
        `;

        // FIXED: Detail Panel Injection inside a sticky container locking it to the viewport width
        if (window.expandedTicket === t.key) {
          html += `
            <div style="grid-column: 1 / -1; width: inherit; border-bottom: 2px solid var(--link-color); background: var(--bg-body); position: relative; z-index: 1;">
                <div style="position: sticky; left: 0; width: 95%; max-width: inherit; padding: 16px 16px; box-sizing: border-box; margin: 0 auto;">
                    ${renderDetailPanel(t)}
                </div>
            </div>
          `;
        }
      });

      html += `</div>`;
      container.innerHTML = html;

      // Scroll to panel if we just expanded it
      if (window.expandedTicket) {
        setTimeout(() => {
          const el = document.getElementById('panel-' + window.expandedTicket);
          if (el) {
            const y = el.getBoundingClientRect().top + window.scrollY - 150;
            window.scrollTo({top: y, behavior: 'smooth'});
          }
        }, 50);
      }
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>

</html>
