<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Monthly Timeline - {{ month_str }}</title>
  <style>
    :root {
      --bg-body: #f4f5f7;
      --bg-surface: #ffffff;
      --text-main: #172b4d;
      --text-muted: #5e6c84;
      --border-color: #dfe1e6;
      --link-color: #0969da;
      --badge-bg-success: #e3fcef;
      --badge-text-success: #066637;
      --badge-bg-info: #deebff;
      --badge-text-info: #0052cc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0d1117;
        --bg-surface: #161b22;
        --text-main: #c9d1d9;
        --text-muted: #8b949e;
        --border-color: #30363d;
        --link-color: #58a6ff;
        --badge-bg-success: rgba(46, 160, 67, 0.15);
        --badge-text-success: #3fb950;
        --badge-bg-info: rgba(56, 139, 253, 0.15);
        --badge-text-info: #58a6ff;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    /* TIMELINE STYLES */
    .timeline-container {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 20px;
      align-items: flex-start;
    }

    .day-column {
      min-width: 350px;
      max-width: 350px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .day-header {
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ticket-header {
      font-size: 0.9em;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .ticket-card {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.85em;
    }

    .ticket-card.active {
      border-left: 4px solid var(--badge-text-info);
    }

    .ticket-card.done {
      border-left: 4px solid var(--badge-text-success);
    }

    .ticket-title {
      font-weight: 600;
      margin-top: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="/" style="font-weight: bold;">⬅️ Back to Daily Reports</a>
    <h1 style="margin: 0;">Timeline: {{ month_str }}</h1>
    <div></div>
  </div>

  <div id="timeline" class="timeline-container">
    <div style="color: var(--text-muted);">Loading timeline data...</div>
  </div>

  <script>
    async function loadTimeline() {
      const container = document.getElementById('timeline');
      try {
        const res = await fetch('/api/month/{{ month_str }}');
        const days = await res.json();

        if (days.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted);">No reports found for this month.</div>';
          return;
        }

        container.innerHTML = days.map(day => `
                    <div class="day-column">
                        <div class="day-header">${day.date}</div>
                        
                        <div class="ticket-list">
                            <div class="ticket-header" style="color: var(--badge-text-info)">Active Work (${day.active.length})</div>
                            ${day.active.map(t => `
                                <div class="ticket-card active">
                                    <a href="/${day.date}" target="_blank">[${t.key}]</a> <span style="opacity: 0.7; font-size: 0.9em">(${t.type})</span>
                                    <div class="ticket-title">${t.summary}</div>
                                </div>
                            `).join('')}
                            ${day.active.length === 0 ? '<em style="color: var(--text-muted); font-size: 0.85em;">No active items</em>' : ''}
                        </div>

                        <div class="ticket-list">
                            <div class="ticket-header" style="color: var(--badge-text-success)">Done / Closed (${day.done.length})</div>
                            ${day.done.map(t => `
                                <div class="ticket-card done">
                                    <a href="/${day.date}" target="_blank">[${t.key}]</a> <span style="opacity: 0.7; font-size: 0.9em">(${t.type})</span>
                                    <div class="ticket-title">${t.summary}</div>
                                </div>
                            `).join('')}
                            ${day.done.length === 0 ? '<em style="color: var(--text-muted); font-size: 0.85em;">No items closed</em>' : ''}
                        </div>
                    </div>
                `).join('');

      } catch (err) {
        container.innerHTML = '<div style="color: red;">Failed to load timeline data.</div>';
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadTimeline);
  </script>
</body>

</html>
