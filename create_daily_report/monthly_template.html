<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Monthly Timeline - {{ month_str }}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-body: #f4f5f7;
      --bg-surface: #ffffff;
      --text-main: #172b4d;
      --text-muted: #5e6c84;
      --border-color: #dfe1e6;
      --link-color: #0969da;
      --badge-bg-success: #e3fcef;
      --badge-text-success: #066637;
      --badge-bg-info: #deebff;
      --badge-text-info: #0052cc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0d1117;
        --bg-surface: #161b22;
        --text-main: #c9d1d9;
        --text-muted: #8b949e;
        --border-color: #30363d;
        --link-color: #58a6ff;
        --badge-bg-success: rgba(46, 160, 67, 0.15);
        --badge-text-success: #3fb950;
        --badge-bg-info: rgba(56, 139, 253, 0.15);
        --badge-text-info: #58a6ff;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    /* DASHBOARD STYLES */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .stat-title {
      font-size: 0.85em;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-val {
      font-size: 2.5em;
      font-weight: bold;
      color: var(--link-color);
      line-height: 1;
    }

    .charts-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }

    .chart-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      position: relative;
      height: 300px;
    }

    /* TIMELINE STYLES */
    .timeline-container {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 20px;
      align-items: flex-start;
    }

    .day-column {
      min-width: 350px;
      max-width: 350px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .day-header {
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ticket-header {
      font-size: 0.9em;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .ticket-card {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.85em;
    }

    .ticket-card.active {
      border-left: 4px solid var(--badge-text-info);
    }

    .ticket-card.done {
      border-left: 4px solid var(--badge-text-success);
    }

    .ticket-title {
      font-weight: 600;
      margin-top: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="/" style="font-weight: bold;">⬅️ Back to Daily Reports</a>
    <h1 style="margin: 0;">Monthly Review: {{ month_str }}</h1>
    <div></div>
  </div>

  <div class="dashboard-grid">
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-title">Total PRs Merged</div>
        <div class="stat-val" id="val-prs-merged">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Avg Cycle Time (Days)</div>
        <div class="stat-val" id="val-cycle-time">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Tickets Closed</div>
        <div class="stat-val" id="val-tickets-closed">--</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-container">
        <canvas id="prChart"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="ticketChart"></canvas>
      </div>
    </div>
  </div>

  <h2 style="border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px;">Daily Timeline</h2>
  <div id="timeline" class="timeline-container">
    <div style="color: var(--text-muted);">Loading timeline data...</div>
  </div>

  <script>
    async function loadTimeline() {
      try {
        const res = await fetch('/api/month/{{ month_str }}');
        const data = await res.json();

        // 1. Populate Stat Cards
        document.getElementById('val-prs-merged').innerText = data.rollup.total_prs_merged;
        document.getElementById('val-cycle-time').innerText = data.rollup.avg_cycle_time;
        document.getElementById('val-tickets-closed').innerText = data.rollup.total_tickets_closed;

        // 2. Render Charts
        Chart.defaults.color = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
        const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();

        new Chart(document.getElementById('prChart'), {
          type: 'line',
          data: {
            labels: data.trends.dates,
            datasets: [
              {label: 'PRs Merged', data: data.trends.prs_merged, borderColor: '#8250df', backgroundColor: 'rgba(130, 80, 223, 0.1)', fill: true, tension: 0.3},
              {label: 'PRs Opened', data: data.trends.prs_opened, borderColor: '#2da44e', backgroundColor: 'transparent', borderDash: [5, 5], tension: 0.3}
            ]
          },
          options: {responsive: true, maintainAspectRatio: false, plugins: {title: {display: true, text: 'Pull Request Volume Trend'}}, scales: {x: {grid: {color: gridColor}}, y: {grid: {color: gridColor}, beginAtZero: true, ticks: {stepSize: 1}}}}
        });

        new Chart(document.getElementById('ticketChart'), {
          type: 'bar',
          data: {
            labels: data.trends.dates,
            datasets: [{label: 'Tickets Closed', data: data.trends.tickets_closed, backgroundColor: '#0969da', borderRadius: 4}]
          },
          options: {responsive: true, maintainAspectRatio: false, plugins: {title: {display: true, text: 'Ticket Completion Trend'}}, scales: {x: {grid: {display: false}}, y: {grid: {color: gridColor}, beginAtZero: true, ticks: {stepSize: 1}}}}
        });

        // 3. Render Timeline
        const container = document.getElementById('timeline');
        if (data.days.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted);">No reports found for this month.</div>';
          return;
        }

        container.innerHTML = data.days.map(day => `
                    <div class="day-column">
                        <div class="day-header">${day.date}</div>
                        
                        <div class="ticket-list">
                            <div class="ticket-header" style="color: var(--badge-text-info)">Active Work (${day.active.length})</div>
                            ${day.active.map(t => `
                                <div class="ticket-card active">
                                    <a href="/${day.date}" target="_blank">[${t.key}]</a> <span style="opacity: 0.7; font-size: 0.9em">(${t.type})</span>
                                    <div class="ticket-title">${t.summary}</div>
                                </div>
                            `).join('')}
                            ${day.active.length === 0 ? '<em style="color: var(--text-muted); font-size: 0.85em;">No active items</em>' : ''}
                        </div>

                        <div class="ticket-list">
                            <div class="ticket-header" style="color: var(--badge-text-success)">Done / Closed (${day.done.length})</div>
                            ${day.done.map(t => `
                                <div class="ticket-card done">
                                    <a href="/${day.date}" target="_blank">[${t.key}]</a> <span style="opacity: 0.7; font-size: 0.9em">(${t.type})</span>
                                    <div class="ticket-title">${t.summary}</div>
                                </div>
                            `).join('')}
                            ${day.done.length === 0 ? '<em style="color: var(--text-muted); font-size: 0.85em;">No items closed</em>' : ''}
                        </div>
                    </div>
                `).join('');

      } catch (err) {
        document.getElementById('timeline').innerHTML = '<div style="color: red;">Failed to load timeline data.</div>';
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadTimeline);
  </script>
</body>

</html>
