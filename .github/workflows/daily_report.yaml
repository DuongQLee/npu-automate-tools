name: Jira Daily Report Schedule

on:
  schedule:
    - cron: '*/15 1-12 * * *'
    - cron: '0,30 0,13-16,18-23 * * *'
    - cron: '30 17 * * *'
    - cron: '1 17 * * *'
  workflow_dispatch: 

concurrency:
  group: "npu-daily-report"
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: self-hosted
    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: Sync Local Manual Folder
        run: |
          cd /home/moreh/npu-automate-tools
          git fetch origin main
          git reset --hard origin/main

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run Snapshot Scripts
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Because of our config.py update, we technically don't even need this env var 
          # anymore unless we want to override it to a completely different hard drive location.
          RESULT_FOLDER: /home/moreh/npu-automate-tools/mv-npu_daily_report 
        run: |
          uv sync
          
          # 👇 Navigate into your new specific tool folder before running!
          cd /home/moreh/npu-automate-tools/create_daily_report
          
          HOUR=$(date -u +'%H')
          MINUTE=$(date -u +'%M')
          
          if [ "$HOUR" == "17" ] && [ "$MINUTE" == "01" ]; then
            echo "🌙 Midnight Rollover detected! Generating Yesterday (-1) and Today (0)..."
            uv run main.py -d -1 0
          else
            echo "☀️ Standard Run! Generating Today (0) only..."
            uv run main.py -d 0
          fi
