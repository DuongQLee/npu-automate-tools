# ==============================================================================
# HISTORY & CONTEXT:
# Initially, this workflow was configured to run automatically via GitHub Actions
# cron schedules (generating midnight snapshots and intra-day updates).
# However, due to the inherent delays and unreliability in GitHub's cron execution, 
# the automated scheduling has been migrated to a native `cron` job directly on 
# the persistent Rocky 9 VM for exact, reliable,-to-the-minute execution.
#
# CURRENT PURPOSE:
# This workflow is now configured for MANUAL TRIGGERING ONLY. 
# It allows developers to manually force a report generation from the GitHub 
# Actions UI for testing, debugging, or recovery purposes.
# ==============================================================================

name: Jira Daily Report Schedule

on:
  workflow_dispatch: 
    inputs:
      days:
        description: 'Days to generate (e.g., "0" for today, "-1 0" for yesterday & today)'
        required: true
        default: '0'

concurrency:
  group: "npu-daily-report"
  cancel-in-progress: false

jobs:
  manual-report:
    runs-on: self-hosted
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: 🚀 Run Manual Report Generation
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_FOLDER: /home/moreh/npu-automate-tools/mv-npu_daily_report 
        run: |
          cd /home/moreh/npu-automate-tools
          
          # Pull the latest code
          git fetch origin main
          git reset --hard origin/main
          
          # Sync dependencies
          uv sync
          
          echo "🚀 Manual Run triggered from GitHub UI!"
          echo "Generating report for target day(s): ${{ github.event.inputs.days }}"
          
          uv run create_daily_report/main.py -d ${{ github.event.inputs.days }}
