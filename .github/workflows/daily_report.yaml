name: Jira Daily Report Schedule

on:
  schedule:
    - cron: '*/15 1-12 * * *'
    - cron: '0,30 0,13-16,18-23 * * *'
    - cron: '30 17 * * *'
    - cron: '1 17 * * *'
  workflow_dispatch: 

concurrency:
  group: "npu-daily-report"
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: self-hosted
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync and Run Snapshot Scripts
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_FOLDER: /home/moreh/npu-automate-tools/mv-npu_daily_report 
        run: |
          # 1. Navigate directly to your persistent project folder
          cd /home/moreh/npu-automate-tools
          
          # 2. Pull the latest code
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Sync dependencies in the correct project root
          uv sync
          
          # 4. Execute the script from the project root
          HOUR=$(date -u +'%H')
          MINUTE=$(date -u +'%M')
          
          if [ "$HOUR" == "17" ] && [ "$MINUTE" == "01" ]; then
            echo "🌙 Midnight Rollover detected! Generating Yesterday (-1) and Today (0)..."
            uv run create_daily_report/main.py -d -1 0
          else
            echo "☀️ Standard Run! Generating Today (0) only..."
            uv run create_daily_report/main.py -d 0
          fi
