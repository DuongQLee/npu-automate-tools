name: Jira Daily Report Schedule

on:
  schedule:
    # 1. High Resolution: 15-min intervals during extended working hours (08:00 - 19:59 VN Time)
    # VN Time is UTC+7. So 08:00 VN = 01:00 UTC, and 19:59 VN = 12:59 UTC.
    - cron: '*/15 1-12 * * *'
    
    # 2. Low Resolution: 30-min intervals outside working hours
    # 20:00 to 23:30 VN (13-16 UTC), 01:00 to 07:30 VN (18-23, 0 UTC)
    - cron: '0,30 0,13-16,18-23 * * *'
    
    # 3. Low Resolution (Midnight Hour Exception): 00:30 VN Time (17:30 UTC)
    - cron: '30 17 * * *'
    
    # 4. Midnight Rollover: 00:01 VN Time (17:01 UTC) - Updates Yesterday AND Today
    - cron: '1 17 * * *'
    
  workflow_dispatch: # Allows you to trigger it manually via a button!

concurrency:
  group: "npu-daily-report"
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: self-hosted
    steps:
      - name: Checkout Latest Main (For the Runner)
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: Sync Local Manual Folder (Safe Reset)
        run: |
          cd /home/moreh/npu-automate-tools
          git fetch origin main
          git reset --hard origin/main

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run Snapshot Scripts
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          RESULT_FOLDER: /home/moreh/npu-automate-tools/mv-npu_daily_report 
        run: |
          uv sync
          
          HOUR=$(date -u +'%H')
          MINUTE=$(date -u +'%M')
          
          if [ "$HOUR" == "17" ] && [ "$MINUTE" == "01" ]; then
            echo "🌙 Midnight Rollover detected! Generating Yesterday (-1) and Today (0)..."
            uv run auto_create_report.py -d -1 0
          else
            echo "☀️ Standard Run! Generating Today (0) only..."
            uv run auto_create_report.py -d 0
          fi
