name: Jira Daily Report Schedule

on:
  schedule:
    # 1. Every hour at minutes 15, 30, and 45 (Minutes are the same in UTC and Local)
    - cron: '15,30,45 * * * *'
    
    # 2. On the hour (minute 0), EXCEPT at local midnight. 
    # Local 00:00 is UTC 17:00. So we skip hour 17 in UTC.
    - cron: '0 0-16,18-23 * * *'
    
    # 3. End of day snapshot: 23:59 Local Time (Which is 16:59 UTC)
    - cron: '59 16 * * *'
    
    # 4. Start of new day snapshot: 00:01 Local Time (Which is 17:01 UTC)
    - cron: '1 17 * * *'
    
  workflow_dispatch: # Allows you to trigger it manually via a button!

jobs:
  run-report:
    runs-on: self-hosted  # Runs on your Rocky 9 VM!
    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: main       # Forces it to explicitly target the main branch
          clean: true     # Wipes any leftover/modified files on the VM from previous runs
          fetch-depth: 1  # Only pulls the latest commit to save time/bandwidth

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run Snapshot Scripts
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }} 
          # Force the script to save OUTSIDE the hidden runner workspace
          RESULT_FOLDER: /home/moreh/mv-npu_daily_report 
        run: |
          uv sync
          uv run auto_create_report.py
          # Disable jira report
          # uv run auto_create_jira_daily_report.py
